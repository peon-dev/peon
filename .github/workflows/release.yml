# Build + push ghcr.io/peon-dev/peon and deploy it to lily.srv.thedevs.cz via the
# shared TheDevs-cz/ci ship workflow (HMAC deploy webhook — no SSH key in CI).
# Replaced the root-SSH deploy to spare.srv on 2026-09-03.
#
# Ships on every push to main (not gated on the Tests workflow, which still runs
# on push/PR and reports on its own). await_deploy: false — the run is green when
# the deploy is QUEUED; the result is visible on the box (lily-deploy-runner).
name: Release

permissions:
    contents: read
    packages: write

on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    ship:
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        with:
            app: peon
            image: ghcr.io/peon-dev/peon
            deploy_host: lily.srv.thedevs.cz
            await_deploy: false
